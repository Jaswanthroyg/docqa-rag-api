x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIR: /data/uploads
  volumes:
    - uploads:/data/uploads   # shared so the worker can read what the API saved
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

volumes:
  pgdata:
  uploads:
